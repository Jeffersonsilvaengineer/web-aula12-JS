<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de compras</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 760px;
            margin: 30px auto;
            padding: 0 16px;
            background: #f7fbff;
            color: #1f2937;
        }
        h1 { color: #0f172a; }
        input, button, select {
            padding: 8px;
            margin: 4px 0;
            border-radius: 8px;
            border: 1px solid #94a3b8;
        }
        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
        }
        button:hover { background: #1d4ed8; }
        .caixa {
            background: white;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.12);
            margin-top: 16px;
        }
        .erro { color: #b91c1c; font-weight: bold; }
        .ok { color: #15803d; font-weight: bold; }
</style>
    <script>
        window.onload = inicio;
        let listaAComprar = [];
        let listaComprados = [];

        function inicio() {
            document.getElementById('btnAdiciona').addEventListener('click', adicionar);
            document.getElementById('btnRemove').addEventListener('click', remover);
            document.getElementById('item').addEventListener('keydown', function(evento) {
                if (evento.key === 'Enter') adicionar();
            });
            atualizar();
        }

        function adicionar() {
            let campoItem = document.getElementById('item');
            let texto = campoItem.value.trim();
            let aviso = document.getElementById('aviso');

            if (texto === '') {
                aviso.textContent = 'Digite um item para adicionar.';
                aviso.className = 'erro';
                return;
            }

            listaAComprar.push(texto);
            campoItem.value = '';
            campoItem.focus();
            aviso.textContent = 'Item colocado na lista de compras.';
            aviso.className = 'ok';
            atualizar();
        }

        function remover() {
            let campoNumero = document.getElementById('numero');
            let numero = Number(campoNumero.value);
            let aviso = document.getElementById('aviso');

            if (numero < 1 || numero > listaAComprar.length || Number.isNaN(numero)) {
                aviso.textContent = 'Informe um número válido da lista Comprar.';
                aviso.className = 'erro';
                return;
            }

            let indice = numero - 1;
            let removidos = listaAComprar.splice(indice, 1);
            listaComprados.push(removidos[0]);

            campoNumero.value = '';
            aviso.textContent = 'Item removido da lista Comprar e enviado para Comprado.';
            aviso.className = 'ok';
            atualizar();
        }

        function atualizar() {
            let listaComprar = document.getElementById('listaAComprar');
            let listaComprado = document.getElementById('listaComprados');
            let qtdComprar = document.getElementById('qtdComprar');
            let qtdComprados = document.getElementById('qtdComprados');

            listaComprar.innerHTML = '';
            listaComprado.innerHTML = '';

            for (let i = 0; i < listaAComprar.length; i++) {
                listaComprar.innerHTML += '<li>' + listaAComprar[i] + '</li>';
            }

            for (let item of listaComprados) {
                listaComprado.innerHTML += '<li>' + item + '</li>';
            }

            qtdComprar.textContent = 'Itens a comprar: ' + listaAComprar.length;
            qtdComprados.textContent = 'Itens comprados: ' + listaComprados.length;
        }
    </script>
</head>
<body>
    <h1>Lista de compras</h1>
    <div class="caixa">
        <label for="item">Item:</label><br>
        <input type="text" id="item" placeholder="Ex.: leite">
        <button id="btnAdiciona">Adicionar</button>
        <p id="aviso"></p>
    </div>

    <div class="caixa">
        <h2>Comprar:</h2>
        <p id="qtdComprar">Itens a comprar: 0</p>
        <ol id="listaAComprar"></ol>

        <label for="numero">Remover item número:</label><br>
        <input type="number" id="numero" min="1" placeholder="Ex.: 1">
        <button id="btnRemove">Remover</button>
    </div>

    <div class="caixa">
        <h2>Comprado:</h2>
        <p id="qtdComprados">Itens comprados: 0</p>
        <ul id="listaComprados"></ul>
    </div>
</body>
</html>
